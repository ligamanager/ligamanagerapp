<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga Manager - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md shadow-2xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">Liga Manager</h1>
    
    <form id="authForm" onsubmit="return false;" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Senha (Palavra-passe)</label>
        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Nome de Usuário</label>
        <input type="text" id="username" placeholder="ex: renan_mngr" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">Gamertag (PSN/Xbox/Steam)</label>
        <input type="text" id="gamertag" placeholder="ex: Renan_Villa" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" id="btnLogin" class="w-1/2 bg-slate-700 hover:bg-slate-600 font-semibold py-2.5 rounded-lg transition">Entrar</button>
        <button type="button" id="btnCadastrar" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 font-semibold py-2.5 rounded-lg transition">Cadastrar</button>
      </div>
    </form>

    <div id="mensagem" class="mt-4 text-center text-sm font-medium"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rhymsnkxlieqzdruirdc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_L-7M9lSNjwLepf5uo8m2YQ_5ZW2J-Bl';
    
    // Inicialização garantida do cliente Supabase
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    const msg = document.getElementById('mensagem');

    document.getElementById('btnCadastrar').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();
      const gamertag = document.getElementById('gamertag').value.trim();

      if (!email || !password || !username) {
        msg.className = "mt-4 text-center text-sm font-medium text-yellow-400";
        msg.innerText = "Preencha o e-mail, senha e nome de usuário.";
        return;
      }

      msg.className = "mt-4 text-center text-sm font-medium text-slate-300";
      msg.innerText = "Criando conta no Supabase...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });

        if (error) {
          msg.className = "mt-4 text-center text-sm font-medium text-red-400";
          msg.innerText = "Erro ao cadastrar: " + error.message;
          return;
        }

        if (data.user) {
          const { error: profileErr } = await supabaseClient.from('profiles').insert([
            { id: data.user.id, username, gamertag }
          ]);

          if (profileErr) {
            msg.className = "mt-4 text-center text-sm font-medium text-yellow-400";
            msg.innerText = "Conta criada! Aviso no perfil: " + profileErr.message;
          } else {
            msg.className = "mt-4 text-center text-sm font-medium text-emerald-400";
            msg.innerText = "Conta criada com sucesso!";
          }
        }
      } catch (err) {
        msg.className = "mt-4 text-center text-sm font-medium text-red-400";
        msg.innerText = "Erro de conexão: " + err.message;
      }
    });

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        msg.className = "mt-4 text-center text-sm font-medium text-yellow-400";
        msg.innerText = "Insira o e-mail e a senha.";
        return;
      }

      msg.className = "mt-4 text-center text-sm font-medium text-slate-300";
      msg.innerText = "Autenticando...";

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          msg.className = "mt-4 text-center text-sm font-medium text-red-400";
          msg.innerText = "Erro no login: " + error.message;
        } else {
          msg.className = "mt-4 text-center text-sm font-medium text-emerald-400";
          msg.innerText = "Login efetuado com sucesso!";
        }
      } catch (err) {
        msg.className = "mt-4 text-center text-sm font-medium text-red-400";
        msg.innerText = "Erro de conexão: " + err.message;
      }
    });
  </script>
</body>
</html>
